[workspace]
resolver = "2"
members = ["core", "proto", "procs", "blob", "backends/docker", "backends/firecracker", "daemon", "cli", "guest-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/chrisyifanjin/vmlayer"

[workspace.dependencies]
vmlayer-core = { path = "core" }
vmlayer-proto = { path = "proto" }
vmlayer-backend-docker = { path = "backends/docker" }
vmlayer-backend-firecracker = { path = "backends/firecracker" }
vmlayer-procs = { path = "procs" }
vmlayer-blob = { path = "blob" }

anyhow = "1"
async-trait = "0.1"
bollard = "0.21"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
futures-core = "0.3"
prost = "0.14"
prost-types = "0.14"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
toml = "1"
tonic = "0.14"
axum = { version = "0.8", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
http = "1"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7"] }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls"] }
flate2 = "1"
zstd = "0.14"
tar = "0.4"
sha2 = "0.11"
