[workspace]
resolver = "2"
members = ["core", "proto", "procs", "backends/docker", "daemon", "cli", "guest-agent"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/chrisyifanjin/vmlayer"

[workspace.dependencies]
vmlayer-core = { path = "core" }
vmlayer-proto = { path = "proto" }
vmlayer-backend-docker = { path = "backends/docker" }
vmlayer-procs = { path = "procs" }

anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
bollard = "0.21"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
futures-core = "0.3"
prost = "0.14"
prost-types = "0.14"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
toml = "1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7"] }
