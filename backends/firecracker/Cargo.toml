[package]
name = "vmlayer-backend-firecracker"
description = "Firecracker backend for vmlayer: one microVM per sandbox, jailed, with memory snapshots and fork."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vmlayer-shim"
path = "src/bin/vmlayer-shim.rs"

[dependencies]
vmlayer-core = { workspace = true }
vmlayer-proto = { workspace = true }
vmlayer-blob = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost-types = { workspace = true }
serde = { workspace = true }
serde_json = "1"
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tower = "0.5"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["socket", "ioctl", "poll", "mman", "uio", "fs", "process"] }

[dev-dependencies]
object_store = { version = "0.14", default-features = false }
tempfile = { workspace = true }
