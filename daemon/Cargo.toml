[package]
name = "vmlayerd"
description = "The vmlayer host daemon: gRPC server, sandbox table, volume store, backend registry."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vmlayerd"
path = "src/main.rs"

[lib]
name = "vmlayerd"
path = "src/lib.rs"

[dependencies]
vmlayer-core = { workspace = true }
vmlayer-proto = { workspace = true }
vmlayer-backend-docker = { workspace = true }
vmlayer-backend-firecracker = { workspace = true }
vmlayer-procs = { workspace = true }
vmlayer-blob = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
prost-types = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
oci-client = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }
tar = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
object_store = { version = "0.14", default-features = false }
tempfile = { workspace = true }
