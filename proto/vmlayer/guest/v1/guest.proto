syntax = "proto3";

package vmlayer.guest.v1;

import "google/protobuf/duration.proto";
import "vmlayer/v1/common.proto";
import "vmlayer/v1/processes.proto";

// Served by the guest agent inside a microVM, over vsock. The agent also
// serves vmlayer.v1.Processes and vmlayer.v1.Files unchanged (sandbox_id is
// ignored), so a backend handle is just a gRPC client. This service holds
// what only makes sense inside the guest.
service Guest {
  rpc Ready(vmlayer.v1.Empty) returns (ReadyResponse);
  // Defaults applied to every process started afterwards: environment (a
  // request's own env wins) and working directory (created if missing).
  rpc Configure(ConfigureRequest) returns (vmlayer.v1.Empty);
  // Mount a block device or a virtio-fs tag at a path, creating the path.
  rpc Mount(MountRequest) returns (vmlayer.v1.Empty);
  rpc Unmount(UnmountRequest) returns (vmlayer.v1.Empty);
  // Start the sandbox entrypoint as process 1 (detached, output buffered).
  rpc StartEntrypoint(EntrypointRequest) returns (vmlayer.v1.Started);
  rpc WaitForPort(WaitForPortRequest) returns (vmlayer.v1.Empty);
  // fsfreeze every mounted volume so the host can snapshot consistently.
  rpc FreezeFs(vmlayer.v1.Empty) returns (vmlayer.v1.Empty);
  rpc ThawFs(vmlayer.v1.Empty) returns (vmlayer.v1.Empty);
  // Rescan the PCI bus after a hot-plugged device (Firecracker PCI mode).
  rpc RescanDevices(vmlayer.v1.Empty) returns (vmlayer.v1.Empty);
  // sync, then power off.
  rpc Shutdown(vmlayer.v1.Empty) returns (vmlayer.v1.Empty);
}

message ReadyResponse {
  string agent_version = 1;
  string kernel = 2;
  // Seconds since the agent started.
  double uptime = 3;
}

message ConfigureRequest {
  map<string, string> env = 1;
  string cwd = 2;
}

message MountRequest {
  // "/dev/vdb" for virtio-blk, or a virtio-fs tag with fstype "virtiofs".
  string source = 1;
  string path = 2;
  // "ext4", "virtiofs", ... ; empty means auto-detect for block devices.
  string fstype = 3;
  bool read_only = 4;
}

message UnmountRequest { string path = 1; }

message EntrypointRequest {
  repeated string argv = 1;
  string cwd = 2;
  map<string, string> env = 3;
}

message WaitForPortRequest {
  uint32 port = 1;
  google.protobuf.Duration timeout = 2;
}
