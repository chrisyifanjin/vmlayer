syntax = "proto3";

package vmlayer.v1;

import "google/protobuf/timestamp.proto";
import "vmlayer/v1/common.proto";

service System {
  rpc Info(Empty) returns (SystemInfo);
  rpc Health(Empty) returns (HealthResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (Empty);
  // Resolve an image for a backend ahead of time: pull it and, for microVM
  // backends, build the root filesystem. Idempotent; later creates are fast.
  rpc PullImage(PullImageRequest) returns (ImageInfo);
  // Delete blob-store chunks that no snapshot references any more.
  rpc CollectGarbage(CollectGarbageRequest) returns (CollectGarbageResponse);
  // Hosts with a fresh heartbeat in the shared blob store, for placement.
  rpc ListHosts(Empty) returns (ListHostsResponse);
}

message HostInfo {
  string host_id = 1;
  // Address to connect to, as the host advertises it.
  string endpoint = 2;
  string daemon_version = 3;
  // Backends usable on the host.
  repeated string backends = 4;
  uint32 cpus = 5;
  // 0 when unknown.
  uint64 memory_mib = 6;
  // Totals over the host's running sandboxes.
  uint32 allocated_vcpus = 7;
  uint64 allocated_memory_mib = 8;
  repeated string sandbox_ids = 9;
  map<string, string> labels = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ListHostsResponse { repeated HostInfo hosts = 1; }

message CollectGarbageRequest {
  // Count what would be deleted without deleting it.
  bool dry_run = 1;
}

message CollectGarbageResponse {
  uint64 snapshots = 1;
  uint64 chunks = 2;
  uint64 referenced_chunks = 3;
  // Unreferenced but within the grace period, so kept.
  uint64 recent_chunks = 4;
  uint64 deleted_chunks = 5;
  uint64 deleted_bytes = 6;
}

message PullImageRequest {
  string image = 1;
  // "auto" or a backend name.
  string backend = 2;
}

message ImageInfo {
  string image = 1;
  string backend = 2;
  // "engine" (the container engine holds it), "ext4" or "dir".
  string rootfs_kind = 3;
  // Host path of the built root filesystem, empty for engine images.
  string rootfs_path = 4;
  repeated string entrypoint = 5;
  string workdir = 6;
}

message BackendInfo {
  string name = 1;
  string engine_version = 2;
  Capabilities capabilities = 3;
  // Why the backend is unavailable on this host, empty if usable.
  string unavailable_reason = 4;
}

message SystemInfo {
  string daemon_version = 1;
  repeated BackendInfo backends = 2;
  string default_backend = 3;
  string data_dir = 4;
  // URL of the blob store for durable snapshots, empty if none.
  string blob_store = 5;
}

message HealthResponse { bool ok = 1; }

message ListSnapshotsRequest { map<string, string> labels = 1; }
message ListSnapshotsResponse { repeated Snapshot snapshots = 1; }
message DeleteSnapshotRequest { string id = 1; }
