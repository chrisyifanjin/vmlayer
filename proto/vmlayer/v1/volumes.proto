syntax = "proto3";

package vmlayer.v1;

import "vmlayer/v1/common.proto";

service Volumes {
  rpc Create(CreateVolumeRequest) returns (Volume);
  rpc FromSnapshot(VolumeFromSnapshotRequest) returns (Volume);
  rpc Get(GetVolumeRequest) returns (Volume);
  rpc List(ListVolumesRequest) returns (ListVolumesResponse);
  rpc Delete(DeleteVolumeRequest) returns (Empty);
  rpc TakeSnapshot(SnapshotVolumeRequest) returns (VolumeSnapshot);
  rpc Clone(CloneVolumeRequest) returns (Volume);
  rpc ListSnapshots(ListVolumeSnapshotsRequest) returns (ListVolumeSnapshotsResponse);
  rpc DeleteSnapshot(DeleteVolumeSnapshotRequest) returns (Empty);
}

message CreateVolumeRequest {
  string name = 1;
  optional uint64 size_mib = 2;
  map<string, string> labels = 3;
}

message VolumeFromSnapshotRequest {
  string snapshot_id = 1;
  string name = 2;
  map<string, string> labels = 3;
}

// By id or by name.
message GetVolumeRequest { string volume = 1; }

message ListVolumesRequest { map<string, string> labels = 1; }
message ListVolumesResponse { repeated Volume volumes = 1; }

message DeleteVolumeRequest { string id = 1; }

message SnapshotVolumeRequest {
  string id = 1;
  bool durable = 2;
  map<string, string> labels = 3;
}

message CloneVolumeRequest {
  string id = 1;
  string name = 2;
}

message ListVolumeSnapshotsRequest { map<string, string> labels = 1; }
message ListVolumeSnapshotsResponse { repeated VolumeSnapshot snapshots = 1; }

message DeleteVolumeSnapshotRequest { string id = 1; }
