[project]
name = "vmlayer"
version = "0.1.0"
description = "The layer between agent runtimes and microVMs: one sandbox API over Firecracker, libkrun and Docker."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Chris Yifan Jin" }]
keywords = ["sandbox", "firecracker", "microvm", "agents", "libkrun"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Emulators",
]
dependencies = ["grpcio>=1.68", "protobuf>=5.26"]

[project.optional-dependencies]
minisweagent = ["mini-swe-agent>=2.0"]
autogen = ["autogen-core>=0.7"]

[dependency-groups]
dev = ["ruff==0.17.5", "mypy==2.4.1", "pytest>=8", "types-protobuf"]
integrations = ["mini-swe-agent>=2.0", "autogen-core>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["vmlayer/v1", "vmlayer/guest"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
exclude = ["vmlayer/v1/", "vmlayer/guest/"]

[[tool.mypy.overrides]]
module = ["vmlayer.v1.*", "vmlayer.guest.*", "grpc", "grpc.*"]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ["minisweagent", "minisweagent.*", "autogen_core", "autogen_core.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
