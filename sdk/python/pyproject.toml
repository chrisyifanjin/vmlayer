[project]
name = "vmlayer"
version = "0.0.0"
description = "The layer between agent runtimes and microVMs: one sandbox API over Firecracker, libkrun and Docker."
readme = "../../README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Chris Yifan Jin" }]
keywords = ["sandbox", "firecracker", "microvm", "agents", "libkrun"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Emulators",
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
