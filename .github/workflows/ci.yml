name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          VMLAYER_DOCKER_TESTS: "1"
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources

  python:
    name: Python (ruff, mypy, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.10
      - run: uv sync --group dev --python 3.10
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy vmlayer
      - name: Generated stubs are current
        run: |
          cd ../.. && ./scripts/gen-proto.sh && git diff --exit-code -- sdk/python/vmlayer/v1
      - run: cargo build -p vmlayerd
        working-directory: .
      - name: Static guest agent (musl)
        working-directory: .
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools
          cargo build --release -p vmlayer-guest-agent --target x86_64-unknown-linux-musl
      - name: End-to-end tests against the daemon, Docker, and the guest agent in a container
        run: uv run pytest -q
        env:
          VMLAYERD_BIN: ${{ github.workspace }}/target/debug/vmlayerd
          VMLAYER_GUEST_AGENT_BIN: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/vmlayer-guest-agent

  typescript:
    name: TypeScript (build, lint, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run sync-proto
      - run: npm run build
      - run: npm run lint
      - run: cargo build -p vmlayerd
        working-directory: .
      - run: npm test
        env:
          VMLAYERD_BIN: ${{ github.workspace }}/target/debug/vmlayerd
