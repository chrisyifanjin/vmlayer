name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: astral-sh/setup-uv@v5
      - name: S3 (MinIO) and Azure Blob (Azurite) endpoints for the blob store tests
        run: scripts/blob-test-stores.sh start | sed 's/^export //' >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          VMLAYER_DOCKER_TESTS: "1"
          VMLAYER_NET_TESTS: "1"
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources

  python:
    name: Python (ruff, mypy, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.10
      - run: uv sync --group dev --group integrations --python 3.10
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy vmlayer
      - name: Generated stubs are current
        run: |
          cd ../.. && ./scripts/gen-proto.sh && git diff --exit-code -- sdk/python/vmlayer/v1 sdk/python/vmlayer/guest
      - name: SDK imports under protobuf 5, 6 and 7
        run: |
          for pb in "protobuf>=5.26,<5.27" "protobuf>=6,<7" "protobuf>=7"; do
            uv run --no-project --python 3.12 --with "$pb" --with "grpcio>=1.68" \
              python -c "import sys; sys.path.insert(0, '.'); import google.protobuf, vmlayer; from vmlayer.v1 import sandboxes_pb2 as s; assert s.CreateSandboxRequest.FromString(s.CreateSandboxRequest(image='x').SerializeToString()).image == 'x'; print('protobuf', google.protobuf.__version__, 'ok')"
          done
      - run: cargo build -p vmlayerd
        working-directory: .
      - name: Static guest agent (musl)
        working-directory: .
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools
          cargo build --release -p vmlayer-guest-agent --target x86_64-unknown-linux-musl
      - name: End-to-end tests against the daemon, Docker, and the guest agent in a container
        run: uv run pytest -q
        env:
          VMLAYERD_BIN: ${{ github.workspace }}/target/debug/vmlayerd
          VMLAYER_GUEST_AGENT_BIN: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/vmlayer-guest-agent
      - name: Harbor trials on vmlayer sandboxes (Python 3.12, Harbor's CLI)
        run: |
          uv run --isolated --python 3.12 --with "harbor==0.26.0" --with pytest --with-editable . \
            pytest -q tests/test_harbor.py
        env:
          VMLAYERD_BIN: ${{ github.workspace }}/target/debug/vmlayerd
      - name: Multi-host tests against S3 (MinIO), with real conditional writes
        run: |
          eval "$(../../scripts/blob-test-stores.sh start)"
          VMLAYER_TEST_BLOB_STORE=s3://vmlayer-test/cluster uv run pytest -q tests/test_cluster.py tests/test_rescue.py
        env:
          VMLAYERD_BIN: ${{ github.workspace }}/target/debug/vmlayerd

  typescript:
    name: TypeScript (build, lint, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run sync-proto
      - run: npm run build
      - run: npm run lint
      - run: cargo build -p vmlayerd
        working-directory: .
      - run: npm test
        env:
          VMLAYERD_BIN: ${{ github.workspace }}/target/debug/vmlayerd

  firecracker:
    # GitHub-hosted Linux runners expose /dev/kvm. They are themselves cloud
    # VMs, so this is x86_64 under nested virtualization, not bare metal.
    name: Firecracker on KVM (x86_64 e2e, benchmark)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Make /dev/kvm usable
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Load the NBD module (lazy volume restore)
        run: |
          sudo modprobe nbd nbds_max=64 \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" && sudo modprobe nbd nbds_max=64) \
            || echo "nbd unavailable: lazy restore falls back to downloading first"
          ls /dev/nbd0 || true
      - name: Install Firecracker, a guest kernel, and build vmlayer
        run: scripts/kvm-vm/provision.sh
        env:
          REPO: ${{ github.workspace }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - name: Start vmlayerd with the Firecracker backend
        run: scripts/kvm-vm/run-daemon.sh
        env:
          VMLAYER_LEASE_TTL_SECS: "6"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
        working-directory: sdk/python
      - name: End-to-end tests against real microVMs
        working-directory: sdk/python
        run: uv run pytest -q tests/test_firecracker.py
        env:
          VMLAYER_FIRECRACKER_ENDPOINT: unix:///run/vmlayer/vmlayerd.sock
      - name: Running microVMs when the daemon is killed (shim, fencing)
        working-directory: sdk/python
        run: uv run pytest -q tests/test_crash.py
        env:
          VMLAYER_FIRECRACKER_ENDPOINT: unix:///run/vmlayer/vmlayerd.sock
          VMLAYER_CRASH_KILL: sudo pkill -9 -x vmlayerd
          VMLAYER_CRASH_START: VMLAYER_LEASE_TTL_SECS=6 ${{ github.workspace }}/scripts/kvm-vm/run-daemon.sh
      - name: Snapshot, restore and fork under load
        working-directory: sdk/python
        run: uv run python ../../bench/stress_snapshots.py --restores 10 --forks 5 --children 3
        env:
          VMLAYER_ENDPOINT: unix:///run/vmlayer/vmlayerd.sock
      - name: Benchmark
        working-directory: sdk/python
        run: |
          uv run python ../../bench/bench.py --image python:3.12-alpine --runs 10 \
            --exec-runs 100 --fork 4 --parallel 4 --memory-mb 256 \
            --label "Firecracker $(cat /opt/vmlayer/firecracker.version), GitHub-hosted x86_64 runner (nested KVM, $(nproc) vCPU)" \
            --json "$RUNNER_TEMP/firecracker-x86_64.json"
        env:
          VMLAYER_ENDPOINT: unix:///run/vmlayer/vmlayerd.sock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firecracker-x86_64
          path: ${{ runner.temp }}/firecracker-x86_64.json
          if-no-files-found: ignore
      - name: Daemon log and failed boot consoles
        if: failure()
        run: |
          sudo tail -n 300 /var/log/vmlayerd.log || true
          sudo sh -c 'for f in /var/lib/vmlayer/firecracker/failed/*.log; do echo "== $f"; tail -n 60 "$f"; done' || true
          sudo sh -c 'for f in /var/lib/vmlayer/firecracker/jail/firecracker/*/shim.log; do echo "== $f"; tail -n 40 "$f"; done' || true
