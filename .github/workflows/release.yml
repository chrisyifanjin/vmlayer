name: Release

# Pushing a v* tag publishes a GitHub release. Running the workflow by hand
# (Actions tab or `gh workflow run release.yml`) is a dry run: it builds every
# artifact and uploads them to the run, and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: protoc
        run: |
          if command -v apt-get >/dev/null; then sudo apt-get update && sudo apt-get install -y protobuf-compiler; else brew install protobuf; fi
      - run: cargo build --release --target ${{ matrix.target }} -p vmlayerd -p vmlayer-cli -p vmlayer-backend-firecracker
      - name: Package
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/vmlayer-${{ github.ref_name }}-${{ matrix.target }}.tar.gz vmlayerd vmlayer vmlayer-shim
          ./target/${{ matrix.target }}/release/vmlayer --version
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.tar.gz
          generate_release_notes: true

  guest-agent:
    name: guest agent ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler musl-tools
      - run: cargo build --release -p vmlayer-guest-agent --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/vmlayer-guest-agent dist/vmlayer-guest-agent-${{ github.ref_name }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: guest-agent-${{ matrix.arch }}
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*

  python:
    name: Python wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: sdk/python/dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: sdk/python/dist/*

  typescript:
    name: TypeScript package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run sync-proto && npm run build && npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: sdk/typescript/*.tgz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: sdk/typescript/*.tgz
