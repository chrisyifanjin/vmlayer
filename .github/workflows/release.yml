name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: protoc
        run: |
          if command -v apt-get >/dev/null; then sudo apt-get update && sudo apt-get install -y protobuf-compiler; else brew install protobuf; fi
      - run: cargo build --release --target ${{ matrix.target }} -p vmlayerd -p vmlayer-cli
      - name: Package
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/vmlayer-${{ github.ref_name }}-${{ matrix.target }}.tar.gz vmlayerd vmlayer
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true

  python:
    name: Python wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: softprops/action-gh-release@v2
        with:
          files: sdk/python/dist/*

  typescript:
    name: TypeScript package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run sync-proto && npm run build && npm pack
      - uses: softprops/action-gh-release@v2
        with:
          files: sdk/typescript/*.tgz
