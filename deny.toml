# cargo-deny: license and advisory policy for the Rust workspace.
[licenses]
# Permissive licenses only. CDLA-Permissive-2.0 covers the Mozilla root
# certificate data bundled by webpki-roots (used when pulling images).
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[advisories]
yanked = "deny"
ignore = [
    # chrono is unmaintained (no known vulnerability). It reaches us only
    # through object_store and oci-client, which use it for timestamps in
    # HTTP metadata. Revisit when either drops it.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, transitive via object_store and oci-client" },
    # humantime is flagged for the same reason (it wraps chrono). object_store
    # uses it to parse duration settings.
    { id = "RUSTSEC-2026-0542", reason = "unmaintained, transitive via object_store" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
